# One record a day, committed to the repo.
#
# This is the entire storage layer. No database, no keys, no service to pay for
# or forget about, and the history lands in git next to the code that produced
# it, so anybody can check what the site claimed on a given day. If this job
# stops running, the site keeps working and simply stops gaining history.
name: Daily snapshot

on:
  schedule:
    # Three attempts, not one. GitHub's own docs say a scheduled workflow can be
    # delayed during periods of high load and may be dropped entirely, which is
    # exactly what happened on 28 Sep 2026: no run, no failure, no email, and a
    # gap in the history that nothing noticed for two days. The record is keyed
    # by UTC date and the append step refuses a date it already holds, so the
    # second and third attempts cost one API call and then exit clean. All three
    # sit inside the same UTC day so a late run still files under the right date.
    - cron: "10 21 * * *"
    - cron: "40 22 * * *"
    - cron: "50 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap guard so the later attempts are nearly free: if the file already
      # carries today's UTC date, there is nothing left to do.
      - name: Skip if today is already recorded
        id: have
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          if node -e "
            const h = require('./data/history.json');
            process.exit(h.some((r) => r.date === process.argv[1]) ? 0 : 1);
          " "$today"; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
            echo "$today is already in history.json."
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
            echo "$today is missing, fetching."
          fi

      # Two passes, not one, and the reason is worth writing down.
      #
      # /api/snapshot used to be cached with stale-while-revalidate, so the
      # first request after a quiet period was served the old entry and only
      # started a rebuild behind it. This job is always the first caller of the
      # day, so it reliably got stale numbers. The route is now uncached, but
      # the warm pass stays as insurance against that setting drifting back:
      # its response is thrown away, and only the second one is recorded.
      #
      # Block scalar, not a folded one. A plain "run:" with a backslash
      # continuation gets folded by YAML into a single line with the backslash
      # still in it, which hands curl a malformed URL and exits 3.
      - name: Warm the endpoint, discard the result
        if: steps.have.outputs.done == 'no'
        run: |
          set -euo pipefail
          curl -sS --max-time 180 "https://stonkpile.xyz/api/snapshot" -o /dev/null || true
          sleep 45

      - name: Fetch today's record
        if: steps.have.outputs.done == 'no'
        run: |
          set -euo pipefail
          curl -sS --fail --retry 4 --retry-delay 15 --retry-all-errors --max-time 180 \
            "https://stonkpile.xyz/api/snapshot" -o /tmp/today.json
          echo "Fetched $(wc -c < /tmp/today.json) bytes"

      - name: Refuse a stale payload
        if: steps.have.outputs.done == 'no'
        run: |
          set -euo pipefail
          node -e "
            const r = require('/tmp/today.json');
            const age = (Date.now() - Date.parse(r.at)) / 60000;
            console.log('Record generated at ' + r.at + ', ' + age.toFixed(1) + ' minutes ago.');
            if (!Number.isFinite(age) || age > 30) {
              console.error('Stale or unreadable payload. Refusing to record it.');
              process.exit(1);
            }
            if (!(r.liquidity > 0)) {
              console.error('Liquidity is not positive. Refusing to record it.');
              process.exit(1);
            }
          "

      - name: Append to history
        if: steps.have.outputs.done == 'no'
        run: |
          set -euo pipefail
          node scripts/append-snapshot.mjs /tmp/today.json

      - name: Commit if anything changed
        if: steps.have.outputs.done == 'no'
        run: |
          set -euo pipefail
          if git diff --quiet -- data/history.json; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git config user.name "stonkpile-bot"
          git config user.email "noreply@stonkpile.xyz"
          git add data/history.json
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          # A later attempt on the same day can race a human push. Rebase rather
          # than fail, because a lost snapshot is the thing this job exists to
          # prevent.
          git pull --rebase --autostash
          git push
